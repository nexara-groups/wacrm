name: Process broadcast queue

on:
  schedule:
    # GitHub Actions schedules run no more frequently than every 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Do not cancel an active run: cancelling it would skip a queued message.
concurrency:
  group: broadcast-queue
  cancel-in-progress: false

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process broadcast queue
        env:
          CRON_SECRET: ${{ secrets.WACRM_CRON_SECRET }}
          QUEUE_URL: ${{ secrets.BROADCAST_QUEUE_URL || 'https://wacrm-eta-bay.vercel.app/api/broadcasts/cron' }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "${QUEUE_URL}"
